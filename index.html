:root[data-theme="dark"]{--bg:#0F2128;--ink:#E6F1EE;--card:#17303A;--line:#2a4752;--blue:#9AA2FF;--green:#5CCB8A;--amber:#F4C25A;--bad:#FF8A80;--soft:#1d3945;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Readex Pro',Tahoma,'Segoe UI',sans-serif;line-height:1.8;font-size:17px}
.wrap{max-width:720px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 14px}
.brand{font-weight:700;font-size:22px;display:flex;align-items:center;gap:8px}
.brand i{width:26px;height:26px;border-radius:50%;border:4px solid var(--blue);display:inline-block;position:relative}
.brand i:after{content:"";position:absolute;width:5px;height:12px;background:var(--blue);bottom:-11px;inset-inline-start:11px;transform:rotate(-35deg);border-radius:3px}
.xp{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:2px 14px;font-weight:600}
nav{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:16px}
nav button{font:inherit;font-size:13px;padding:8px 2px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
nav button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
:root:not([data-theme="light"]) nav button.on{color:#0F2128}
nav button.ok:after{content:" ✓";color:var(--green);font-weight:700}
nav button.on.ok:after{color:inherit}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:14px}
h1{font-size:28px;line-height:1.4;margin:0 0 8px}
h2{font-size:22px;margin:0 0 8px}
p{margin:0 0 10px;max-width:60ch}
.btn{font:inherit;font-weight:600;background:var(--blue);color:#fff;border:0;border-radius:12px;padding:10px 22px;cursor:pointer}
:root:not([data-theme="light"]) .btn{color:#0F2128}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input{font:inherit;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-width:200px}
button:focus-visible,input:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar b{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .4s}
.opts{display:grid;gap:10px;margin:14px 0}
.opt{font:inherit;text-align:start;padding:12px 16px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.opt.right{border-color:var(--green);background:color-mix(in srgb,var(--green) 18%,var(--bg))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,var(--bg))}
.note{padding:10px 14px;border-radius:12px;background:var(--soft);margin-top:8px}
.hint{color:var(--amber);font-weight:600}
.fig{display:flex;justify-content:center;background:var(--soft);border-radius:14px;margin-bottom:14px;padding:6px}
.fig svg{width:100%;max-height:150px}
ul.pts{padding-inline-start:20px;margin:6px 0}
.badges{display:flex;gap:10px;flex-wrap:wrap}
.badge{padding:6px 14px;border-radius:999px;border:1px dashed var(--line);opacity:.55}
.badge.got{opacity:1;border:1px solid var(--amber);background:color-mix(in srgb,var(--amber) 20%,var(--card))}
.track{position:relative;height:46px;background:var(--soft);border-radius:12px;margin:8px 0;overflow:hidden}
.ship{position:absolute;top:4px;font-size:28px;transition:inset-inline-start .35s linear;inset-inline-start:0;transform:scaleX(-1)}
.finish{position:absolute;inset-inline-end:0;top:0;bottom:0;width:6px;background:repeating-linear-gradient(var(--ink) 0 6px,transparent 6px 12px)}
.timer{font-weight:700;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.hd{display:flex;align-items:center;gap:10px}
.hd img{height:64px;width:auto;background:#fff;border-radius:12px;padding:4px}
.tb{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px 14px;margin-bottom:14px}
.tb img{height:64px;width:auto;background:#fff;border-radius:12px}
.tb b{font-size:18px}.tb small{display:block;opacity:.8;line-height:1.5}
select{font:inherit;width:100%;margin-top:6px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
select:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
nav button:disabled{opacity:.4;cursor:default}@media(max-width:480px){nav button{font-size:11.5px;padding:8px 1px}}
.hb{width:100%;border-collapse:collapse}.hb td{padding:10px 8px;border-bottom:1px solid var(--line)}
.hb tr.me{background:color-mix(in srgb,var(--amber) 22%,transparent)}
.hb .rk{width:48px;font-weight:700;text-align:center}.hb .sc{text-align:end;font-weight:700;font-variant-numeric:tabular-nums}
.bdg{text-align:center;border:2px solid var(--amber);border-radius:18px;padding:14px;margin:14px 0;background:color-mix(in srgb,var(--amber) 14%,var(--card))}
.bdg img{width:min(100%,300px);height:auto;background:#fff;border-radius:14px}.ill{margin:0 0 12px}.ill svg{width:100%;height:auto;border-radius:14px;display:block}.ill small{display:block;text-align:center;opacity:.8;margin-top:4px}.pool{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;min-height:44px}.chip{font:inherit;border:2px solid var(--line);background:var(--soft);color:var(--ink);border-radius:12px;padding:6px 12px;cursor:grab;display:inline-block}.chip.sel{outline:3px solid var(--blue)}.chip.ok{background:color-mix(in srgb,#2e9e5b 28%,var(--card));cursor:default}.tgs{display:grid;gap:8px}.drop{border:2px dashed var(--line);border-radius:14px;padding:8px 12px;min-height:56px;background:var(--card);cursor:pointer}.drop .got{margin-top:6px}.y2{display:inline-block;background:var(--amber);color:#1b1b1b;border-radius:10px;padding:1px 10px;font-size:1.05em}
.bdg .bn{font-size:26px;font-weight:700;margin:8px 0 2px}
.bdg p{margin:0 auto 6px}
.fld{display:block;margin-top:14px;font-weight:600}
#nm{width:100%;margin-top:6px}
textarea{font:inherit;width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.ico{text-align:center;font-size:20px;letter-spacing:1px;white-space:nowrap;overflow:hidden;opacity:.85;margin:-4px 0 10px;user-select:none}
button.xp{font:inherit;color:var(--ink);cursor:pointer}

.ft-d{font-weight:700;font-size:15px;line-height:1.5}
.ft-b{display:flex;justify-content:center;gap:12px;margin:6px 0}

.ft-a:focus-visible{outline:3px solid #F4C25A;outline-offset:2px}
.ft-c{font-size:12px;opacity:.9;direction:ltr}
.star{position:fixed;top:-40px;z-index:60;pointer-events:none;animation:fall 2.2s ease-in forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(300deg);opacity:.2}}
.cheer{font-size:20px;font-weight:700;color:var(--green)}.cheer.bad{color:var(--bad)}
.chip{margin-inline-start:auto;background:var(--soft);border-radius:999px;padding:2px 12px;font-size:14px;font-weight:600}
.badge small{opacity:.8;margin-inline-start:6px}
.cn{display:inline-block;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFF3B0,#F4C430 55%,#B8860B);border:1.5px solid #B8860B;vertical-align:-3px;margin-inline-end:6px}
.coin{position:fixed;left:0;top:0;width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFF3B0,#F4C430 55%,#B8860B);border:2px solid #B8860B;box-shadow:0 2px 6px rgba(0,0,0,.3);z-index:70;pointer-events:none;display:flex;align-items:center;justify-content:center;font-weight:700;color:#8A6100;font-size:15px;transition:transform .9s cubic-bezier(.25,.8,.3,1),opacity .25s}
.xp.bump{animation:bump .25s}

.cstack i{position:absolute;inset-inline-start:0;width:26px;height:10px;border-radius:50%;background:radial-gradient(ellipse at 50% 30%,#FFF1A8,#F2B705 70%);border:1.5px solid #9A6B00;box-shadow:0 3px 0 #B8860B}
.cstack i:nth-child(1){bottom:0}.cstack i:nth-child(2){bottom:5px}.cstack i:nth-child(3){bottom:10px}.cstack i:nth-child(4){bottom:15px}
header{flex-wrap:wrap}

const esc=x=>String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tb=()=>`<div class="tb"><img src="${TEACHER}" alt="أ. محمد عمارة"><div><b>أ. محمد عمارة</b><small>معلم المادة في مدارس أطياب الأهلية</small></div>${S.lesson&&LESSONS[S.lesson]?`<span class="chip">${LESSONS[S.lesson].i} ${LESSONS[S.lesson].n}</span>`:''}</div>`;
let view='home';

let CARDS=[],PRACTICE=[],QUIZ=[];
let LESSONS={};const ILL={};
function setLesson(id){S.lesson=id;const L=LESSONS[id];CARDS=L.c;PRACTICE=L.p;QUIZ=L.q;S.done=(S.prog&&S.prog[id])||{}}
function restoreState(){if(!S.prog)S.prog={};if(S.lesson&&LESSONS[S.lesson])setLesson(S.lesson);else{S.lesson='';S.done={}}}
const shuffle=a=>a.map(x=>[Math.random(),x]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
let animXP=null;
function coinSound(k){beep([[988,.06],[1319+Math.min(k,8)*30,.2]],'square',.07)}
function coinFly(gain,prev){
  animXP=prev;$('#xp').textContent=prev;
  const finish=()=>{animXP=null;$('#xp').textContent=S.xp};
  if(matchMedia('(prefers-reduced-motion:reduce)').matches){setTimeout(finish,200);return}
  setTimeout(()=>{
    const el=$('#xp');if(!el){finish();return}
    const tr=el.getBoundingClientRect(),h=document.querySelector('#app .card')||$('#app'),sr=h.getBoundingClientRect();
    const sx=sr.left+sr.width/2,sy=Math.max(120,Math.min(sr.top+sr.height/3,innerHeight*0.55));
    const n=Math.min(12,Math.max(4,Math.round(gain/4))),per=gain/n;let got=0;
    for(let i=0;i<n;i++)setTimeout(()=>{
      const c=document.createElement('span');c.className='coin';c.textContent='★';
      c.style.transform=`translate(${sx+(Math.random()-.5)*80}px,${sy+(Math.random()-.5)*50}px)`;document.body.appendChild(c);
      requestAnimationFrame(()=>requestAnimationFrame(()=>{c.style.transform=`translate(${tr.left+tr.width/2-15}px,${tr.top+tr.height/2-15}px) scale(.5)`}));
      setTimeout(()=>{c.style.opacity='0';setTimeout(()=>c.remove(),260);got++;animXP=Math.min(S.xp,Math.round(prev+per*got));el.textContent=animXP;coinSound(got);const b=el.parentElement;b.classList.remove('bump');void b.offsetWidth;b.classList.add('bump');if(got>=n)finish()},950);
    },i*110)
  },350)
}
function addXP(n,key){const prev=S.xp;if(key){S.pts=S.pts||{};const k=S.lesson+':'+key;if(n>(S.pts[k]||0))S.pts[k]=n;S.xp=Object.values(S.pts).reduce((a,b)=>a+b,0)}save();if(key&&S.xp>prev)coinFly(S.xp-prev,prev);else $('#xp').textContent=S.xp}
const lessonPts=()=>['learn','practice','quiz','lab','race'].reduce((a,k)=>a+((S.pts||{})[S.lesson+':'+k]||0),0);
let AC=null;
function beep(seq,type,vol){try{if(S.mute)return;AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();let t=AC.currentTime;seq.forEach(([f,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d);t+=d*0.85})}catch(e){}}
const CHEER_OK=['ممتاز','عظيم','بطل','مبدع','رائع'],CHEER_NO=['هانت','قربت','حاول مرة أخرى','لا بأس'];
const cheer=ok=>(ok?CHEER_OK:CHEER_NO)[Math.floor(Math.random()*(ok?CHEER_OK:CHEER_NO).length)]+(ok?' ✨':' 💪');
function stars(n){const r=matchMedia('(prefers-reduced-motion:reduce)').matches;if(r)n=Math.min(n,6);for(let i=0;i<n;i++){const e=document.createElement('span');e.className='star';e.textContent=['⭐','✨','🌟'][i%3];e.style.left=Math.random()*94+'vw';e.style.animationDelay=Math.random()*.5+'s';e.style.fontSize=(16+Math.random()*16)+'px';document.body.appendChild(e);setTimeout(()=>e.remove(),2800)}}
function fx(ok,small){if(ok){beep([[523,.12],[659,.12],[784,.12],[1047,.3]],'triangle',.18);stars(small?8:26)}else beep([[220,.18],[165,.32]],'sawtooth',.12);const c=$('#ch');if(c){c.textContent=cheer(ok);c.className='cheer'+(ok?'':' bad')}}
function togSnd(){S.mute=!S.mute;save();$('#snd').textContent=S.mute?'🔇':'🔊';if(!S.mute)beep([[659,.1]],'triangle',.12)}
const illHtml=()=>{const f=ILL[S.lesson];return f?`<div class="ill">${f()}<small>${esc(LESSONS[S.lesson].st||'')}</small></div>`:''};

function lab(){
  const D=LESSONS[S.lesson].lab;let a=0;const gains=[0,0];
  const acts=[{t:'اربط كل مصطلح بوصفه',h:'اضغط المصطلح ثم اضغط وصفه، أو اسحبه إلى مكانه.',tg:D.m.map(x=>x[1]),it:D.m.map((x,i)=>[x[0],i])},{t:'صنّف العناصر في مكانها الصحيح',h:'اضغط العنصر ثم اضغط المجموعة، أو اسحبه إليها.',tg:[D.s[0],D.s[1]],it:D.s[2]}];
  const run=()=>{
    const A=acts[a],placed={};let mis=0,sel=-1,msg='';
    const idn=n=>Array.from({length:n},(_,i)=>i),sh2=n=>{let o,t=0;do{o=shuffle(idn(n));t++}while(t<30&&o.every((v,i)=>v===i));return o},io=sh2(A.it.length),to=a===0?sh2(A.tg.length):idn(A.tg.length);
    const draw=()=>{
      $('#app').innerHTML=`<div class="card"><p>النشاط ${a+1} من 2</p><h2>🧩 ${A.t}</h2><p class="hint">${A.h}</p>
      <div class="pool">${io.map(k=>placed[k]?'':`<button class="chip ${sel===k?'sel':''}" draggable="true" data-k="${k}">${esc(A.it[k][0])}</button>`).join('')}</div>
      <div class="tgs">${to.map(j=>`<div class="drop" data-j="${j}" tabindex="0"><b>${esc(A.tg[j])}</b><div class="got">${A.it.map(([x,tj],k)=>placed[k]&&tj===j?`<span class="chip ok">${esc(x)}</span>`:'').join('')}</div></div>`).join('')}</div>${msg}</div>`;
      document.querySelectorAll('.chip[data-k]').forEach(c=>{c.onclick=()=>{sel=sel===+c.dataset.k?-1:+c.dataset.k;msg='';draw()};c.ondragstart=e=>e.dataTransfer.setData('text',c.dataset.k)});
      document.querySelectorAll('.drop').forEach(d=>{const j=+d.dataset.j,put=k=>{if(k<0||isNaN(k))return;
        if(A.it[k][1]===j){placed[k]=1;sel=-1;fx(true,1);msg=`<div class="note"><b class="cheer">${cheer(true)}</b></div>`}else{mis++;sel=-1;fx(false);msg=`<div class="note"><b class="cheer bad">${cheer(false)}</b> ليس هذا مكانه، حاول مرة أخرى.</div>`}
        if(Object.keys(placed).length===A.it.length)done();else draw()};
        d.onclick=()=>put(sel);d.onkeydown=e=>{if(e.key==='Enter')put(sel)};d.ondragover=e=>e.preventDefault();d.ondrop=e=>{e.preventDefault();put(+e.dataTransfer.getData('text'))}});
    };
    const done=()=>{gains[a]=Math.max(5,15-2*mis);
      if(a===0){$('#app').innerHTML=`<div class="card"><h1>أحسنت</h1><p>أخطاؤك في هذا النشاط: ${mis}. أنجزت ${gains[0]} من 15 نقطة.</p><div class="row"><button class="btn" id="nx">النشاط التالي</button></div></div>`;$('#nx').onclick=()=>{a=1;run()}}
      else{S.done.lab=true;const g=gains[0]+gains[1];addXP(g,'lab');$('#app').innerHTML=`<div class="card"><h1>أنهيت التطبيق العملي</h1><p>حصلت على ${g} نقطة من 30. تُحتسب أعلى نتيجة لك.</p><div class="row"><button class="btn ghost" onclick="go('lab')">أعد النشاط</button><button class="btn" onclick="go('race')">إلى السباق</button></div></div>`}};
    draw();
  };
  run();
}

const HUES={};
function theme(){const dark=matchMedia('(prefers-color-scheme:dark)').matches,st={learn:0,practice:1,quiz:2,lab:3,race:4}[view]||0,base=(S.lesson&&HUES[S.lesson]!==undefined)?HUES[S.lesson]:215,h=(base+st*22)%360,r=document.documentElement.style,v=(k,x)=>r.setProperty(k,x);
  if(dark){v('--blue',`hsl(${h} 80% 76%)`);v('--bg',`hsl(${h} 35% 11%)`);v('--card',`hsl(${h} 30% 16%)`);v('--soft',`hsl(${h} 28% 20%)`);v('--line',`hsl(${h} 22% 30%)`);v('--ink','#EAF2F0')}
  else{v('--blue',`hsl(${h} 58% 34%)`);v('--bg',`hsl(${h} 45% 95%)`);v('--card','#fff');v('--soft',`hsl(${h} 38% 90%)`);v('--line',`hsl(${h} 28% 80%)`);v('--ink',`hsl(${h} 45% 14%)`)}}
try{matchMedia('(prefers-color-scheme:dark)').addEventListener('change',theme)}catch(e){}

function badgeHtml(){const p=lessonPts(),b=curBadge();return `<div class="bdg"><img src="${TEACHER2}" alt="أ. محمد عمارة"><div class="bn">${b.i} ${b.n}</div><p>لقد منحتك شارة «${b.n}» بحسب مجموع نقاطك في هذا الدرس (${p} نقطة).</p><small>أ. محمد عمارة</small></div>`}
function wipe(keepName){S.xp=0;S.done={};S.prog={};S.pts={};S.lesson='';CARDS=[];PRACTICE=[];QUIZ=[];if(!keepName)S.name=''}
const NEED={practice:'learn',quiz:'practice',lab:'quiz',race:'lab'};
const okTo=k=>k==='home'||(!!S.name&&!!S.lesson&&(!NEED[k]||!!S.done[NEED[k]]));
function navDraw(){const t=TABS;$('#nav').style.gridTemplateColumns='1.45fr repeat(5,1fr)';$('#nav').innerHTML=t.map(([k,l])=>`<button class="${view===k?'on':''} ${S.done[k]?'ok':''}" ${okTo(k)?'':'disabled'} onclick="go('${k}')">${l}</button>`).join('')}
function askRestart(){$('#rsx').innerHTML='<div class="note">ستُمسح نقاطك وتقدمك في كل الدروس، وتبدأ من جديد. هل أنت متأكد؟</div><div class="row" style="margin-top:10px"><button class="btn" onclick="restart()">نعم، امسح نتائجي</button><button class="btn ghost" onclick="render()">إلغاء</button></div>'}
function restart(){wipe(true);save();$('#xp').textContent=0;view='home';render()}
function go(v){if(!okTo(v))return;clearInterval(timer);view=v;render()}

function render(){
  if(!okTo(view))view='home';
  theme();$('#snd').textContent=S.mute?'🔇':'🔊';
  $('#xp').textContent=animXP!==null?animXP:S.xp;
  navDraw();
  ({home,learn:()=>learn(0),practice:()=>runner(PRACTICE.slice(0,6),'practice',6),quiz:()=>runner(shuffle(QUIZ).slice(0,6),'quiz',6),lab,race})[view]();
  window.scrollTo(0,0);$('#tb').innerHTML=['learn','practice','quiz','lab','race'].includes(view)?tb():'';$('#lg').src=LOGO;
}

function startSetup(){
  const nm=$('#nm').value.trim(),ls=$('#ls2').value,msg=$('#sm');
  if(!nm){$('#nm').style.borderColor='var(--bad)';$('#nm').focus();msg.textContent='اكتب اسمك أولًا.';return}
  if(!ls){$('#ls2').focus();msg.textContent='اختر الدرس.';return}
  S.name=nm;save();setLesson(ls);save();
  go(['learn','practice','quiz','lab','race'].find(k=>!S.done[k])||'race');
}
function changeLesson(){save();S.lesson='';S.done={};save();render()}
const lessonOptions=()=>{const gs={};Object.keys(LESSONS).forEach(k=>{const L=LESSONS[k];(gs[L.g]=gs[L.g]||[]).push(k)});return Object.keys(gs).map(g=>`<optgroup label="${g}">${gs[g].map(k=>`<option value="${k}">${LESSONS[k].i} ${LESSONS[k].k?LESSONS[k].k+' — ':''}${LESSONS[k].n}</option>`).join('')}</optgroup>`).join('')};
const progCard=()=>{const n=Object.keys(S.done).filter(k=>S.done[k]).length,cb=S.lesson&&S.done.race?curBadge().n:'';return `<div class="card"><h2>تقدمك: ${n} من 5</h2><div class="bar"><b style="width:${n*20}%"></b></div><p style="margin-top:12px">الشارات التي يمكنك الحصول عليها في نهاية السباق${S.lesson?'':' (بحسب نقاط الدرس)'}:</p><div class="badges">${bandInfo().map(b=>`<span class="badge ${cb===b.n?'got':''}">${b.i} ${b.n}<small>${b.a===b.b?b.a:b.a+'–'+b.b}</small></span>`).join('')}</div></div>`};
function home(){
  if(!(S.name&&S.lesson)){
    $('#app').innerHTML=`<div class="card"><h1>مرحبًا بك في مجهر، لنتعلم بالتجربة</h1>
    <p>اختر الدرس ثم اضغط «ابدأ». لن تنتقل إلى أي مهمة قبل إكمال الخطوات.</p>
    <label class="fld" for="nm">اسمك</label><input id="nm" readonly value="${esc(S.name||'')}">
    <label class="fld" for="ls2">الدرس</label><select id="ls2"><option value="">— اختر الدرس —</option>${lessonOptions()}</select>
    <p id="sm" class="hint" style="margin-top:10px"></p><div class="row"><button class="btn" onclick="startSetup()">ابدأ</button></div></div>`+progCard();
    return;
  }
  const n=Object.keys(S.done).filter(k=>S.done[k]).length,nxt=['learn','practice','quiz','lab','race'].find(k=>!S.done[k])||'race';
  $('#app').innerHTML=`<div class="card"><h1>أهلًا ${esc(S.name)}، لنتعلم بالتجربة</h1>
  <p>الدرس الحالي: <b>${LESSONS[S.lesson].i} ${LESSONS[S.lesson].n}</b> — أحياء 2. شرح من خمس شرائح، ثم تدريب، ثم اختبار، ثم تطبيق عملي، ثم سباق ضد مركبة منافسة. أكمل كل مهمة لتفتح التي بعدها.</p>
  <div class="row"><button class="btn" onclick="go('${nxt}')">${n?'تابع من حيث توقفت':'ابدأ الدرس'}</button><button class="btn ghost" onclick="changeLesson()">تغيير الدرس</button></div>
  <div id="rsx" class="row" style="margin-top:12px"><button class="btn ghost" onclick="askRestart()">ابدأ من جديد (مسح نتائجي)</button></div></div>`+progCard();
}
function learn(i){
  const c=CARDS[i],last=i===CARDS.length-1;
  $('#app').innerHTML=`<div class="card"><div class="bar" style="margin-bottom:14px"><b style="width:${(i+1)/CARDS.length*100}%"></b></div>
  ${i===0&&ILL[S.lesson]?illHtml():''}<div class="fig" style="${i===0&&ILL[S.lesson]?'display:none':''}">${c.svg?`<svg viewBox="0 0 300 150" role="img" aria-label="${c.t}">${c.svg}</svg>`:`<span style="font-size:72px;line-height:1.3" role="img" aria-label="${c.t}">${c.e}</span>`}</div>
  <h2>${c.t}</h2>${c.p.map(x=>`<p>${x}</p>`).join('')}
  <div class="row"><button class="btn ghost" ${i?'':'disabled'} onclick="learn(${i-1})">السابق</button>
  <button class="btn" onclick="${last?'finishLearn()':'learn('+(i+1)+')'}">${last?'أنهيت الدرس':'التالي'}</button></div></div>`;
}
function finishLearn(){S.done.learn=true;addXP(20,'learn');go('practice')}

function runner(bank,mode,total){
  let i=0,score=0,first=true,locked=false;
  const show=()=>{
    const it=bank[i];{const c0=it.o[it.a];it.o=shuffle(it.o);it.a=it.o.indexOf(c0)}first=true;locked=false;
    $('#app').innerHTML=`<div class="card"><div class="bar" style="margin-bottom:14px"><b style="width:${i/total*100}%"></b></div>
    ${mode==='practice'?illHtml():''}<p>السؤال ${i+1} من ${total}</p><h2>${it.q}</h2><div class="opts">${it.o.map((o,k)=>`<button class="opt" data-k="${k}">${o}</button>`).join('')}</div><div id="fb"></div></div>`;
    document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(b,+b.dataset.k));
  };
  const pick=(b,k)=>{
    if(locked)return;const it=bank[i];
    if(k===it.a){locked=true;b.classList.add('right');if(first)score++;fx(true);
      $('#fb').innerHTML=`<div class="note"><b class="cheer">${cheer(true)}</b> ${it.e||''}</div><div class="row" style="margin-top:10px"><button class="btn" id="nx">${i+1<total?'التالي':'النتيجة'}</button></div>`;
      $('#nx').onclick=()=>{i++;i<total?show():end()};$('#nx').focus();
    }else{
      b.classList.add('wrong');b.disabled=true;fx(false);
      if(mode==='practice'){first=false;$('#fb').innerHTML=`<div class="note"><b class="cheer bad">${cheer(false)}</b> <span class="hint">تلميح:</span> ${it.h}</div>`}
      else{locked=true;document.querySelectorAll('.opt')[it.a].classList.add('right');
        $('#fb').innerHTML=`<div class="note"><b class="cheer bad">${cheer(false)}</b> الإجابة الصحيحة موضحة بالأخضر. ${it.e}</div><div class="row" style="margin-top:10px"><button class="btn" id="nx">${i+1<total?'التالي':'النتيجة'}</button></div>`;
        $('#nx').onclick=()=>{i++;i<total?show():end()};$('#nx').focus()}
    }
  };
  const end=()=>{
    const pass=score>=4,gain=score*5+(pass?15:0);
    if(pass)S.done[mode]=true;addXP(gain,mode);
    const next=mode==='practice'?'quiz':'lab';
    $('#app').innerHTML=`<div class="card"><h1>${score} من ${total}</h1>
    <p>${pass?'أحسنت، حصلت على '+gain+' نقطة. تُحتسب أعلى نتيجة لك في كل مهمة.':'تحتاج إلى 4 إجابات صحيحة على الأقل من 6 للانتقال. راجع الدرس ثم أعد المحاولة، فالتكرار يثبّت المعلومة.'}</p>
    <div class="row"><button class="btn ghost" onclick="go('${mode}')">أعد المحاولة</button>
    <button class="btn ghost" onclick="go('learn')">راجع الدرس</button>
    ${pass?`<button class="btn" onclick="go('${next}')">${mode==='practice'?'إلى الاختبار':'إلى التطبيق العملي'}</button>`:''}</div></div>`;
  };
  show();
}

let timer;
function race(){
  const bank=shuffle(QUIZ.concat(PRACTICE.map(p=>({...p,e:p.h}))));
  let i=0,me=0,rival=0,left=80,over=false;
  $('#app').innerHTML=`<div class="card"><h2>سباق المركبات</h2><p>أجب بسرعة لتتقدم مركبتك 🚀 قبل أن تصل المنافِسة 🛸 إلى خط النهاية. الوقت: <span class="timer" id="tm">80</span> ثانية.</p>
  <div class="track"><span class="ship" id="me">🚀</span><span class="finish"></span></div>
  <div class="track"><span class="ship" id="rv">🛸</span><span class="finish"></span></div>
  <div id="ch" class="cheer" aria-live="polite" style="min-height:30px"></div><div id="qa"></div></div>`;
  const q=()=>{const it=bank[i%bank.length];{const c0=it.o[it.a];it.o=shuffle(it.o);it.a=it.o.indexOf(c0)}
    $('#qa').innerHTML=`<h2>${it.q}</h2><div class="opts">${it.o.map((o,k)=>`<button class="opt" data-k="${k}">${o}</button>`).join('')}</div>`;
    document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(over)return;
      if(+b.dataset.k===it.a){me=Math.min(100,me+10);fx(true,1)}else{b.classList.add('wrong');rival=Math.min(100,rival+4);fx(false)}
      i++;draw();if(me>=100)finish(true);else setTimeout(()=>!over&&q(),b.classList.contains('wrong')?350:0)})};
  const draw=()=>{$('#me').style.insetInlineStart=`calc(${me}% - ${me*0.4}px)`;$('#rv').style.insetInlineStart=`calc(${rival}% - ${rival*0.4}px)`;$('#tm').textContent=left};
  const finish=w=>{over=true;clearInterval(timer);
    const gain=w?50:15;if(w)S.done.race=true;addXP(gain,'race');
    $('#app').innerHTML=`<div class="card"><h1>${w?'فزت بالسباق':'سبقتك المنافِسة هذه المرة'}</h1>
    <p>حصلت على ${gain} نقطة. ${w?'أتقنت درس '+LESSONS[S.lesson].n+'.':'جرّب مرة أخرى بعد مراجعة الدرس.'}</p>${badgeHtml()}${honorHtml()}
    <div class="row"><button class="btn" onclick="go('race')">سباق جديد</button><button class="btn ghost" onclick="go('home')">الرئيسية</button></div></div>`};
  timer=setInterval(()=>{left-=0.2;rival=Math.min(100,rival+100/(80*5)*1.0);draw();
    $('#tm').textContent=Math.max(0,Math.ceil(left));
    if(rival>=100||left<=0)finish(false)},200);
  q();draw();
}
/* ===== الحماية: الدخول والجلسة وجلب المحتوى (يتوافق مع Code.gs الخاص بمجهر) ===== */
const API='https://script.google.com/macros/s/AKfycbxOL59ET7rrNpI_YheLgPFNu6lIjxSSBFlXdx-DF1vFwahDfgUT7W6HRpN0KkuLfwvD/exec';
const CITIES=['الرياض','جدة','مكة المكرمة','المدينة المنورة','الدمام','الخبر','الظهران','الأحساء','الجبيل','القطيف','الطائف','بريدة','عنيزة','تبوك','حائل','أبها','خميس مشيط','نجران','جازان','الباحة','عرعر','سكاكا','ينبع','الخرج','أخرى'];
const okName=n=>{n=String(n||'').normalize('NFC').trim().replace(/\s+/g,' ');if(n.length>60)return null;const p=n.split(' ');if(p.length<3)return null;for(const w of p)if(!/^[\p{L}\p{M}]{2,}$/u.test(w))return null;return n};
const devId=()=>{try{let d=localStorage.getItem('mj2d');if(!d||d.length<16){const a=new Uint8Array(16);crypto.getRandomValues(a);d=Array.from(a,b=>b.toString(16).padStart(2,'0')).join('');localStorage.setItem('mj2d',d)}return d}catch(e){return 'x'+Math.random().toString(16).slice(2).padEnd(24,'0')}};
async function api(act,p){
  if(API.includes('ضع_المعرّف'))return{ok:0,net:1,m:'لم يُربط الخادم بعد. ضع رابط تطبيق الويب في الصفحة.'};
  try{const r=await fetch(API+'?'+new URLSearchParams({act,...p}));return await r.json()}
  catch(e){return{ok:0,net:1,m:'تعذر الاتصال بالخادم. تأكد من الإنترنت ثم أعد المحاولة.'}}
}
const getSess=()=>{try{return JSON.parse(localStorage.getItem('mj2s')||'null')}catch(e){return null}};
const setSess=s=>{try{s?localStorage.setItem('mj2s',JSON.stringify(s)):localStorage.removeItem('mj2s')}catch(e){}};
const skey=n=>btoa(unescape(encodeURIComponent(n))).replace(/[^A-Za-z0-9]/g,'').slice(0,28);
const gate=(h,b)=>{$('#nav').innerHTML='';$('#tb').innerHTML='';const w=document.getElementById('wm');if(w)w.remove();$('#app').innerHTML=`<div class="card"><h1>${h}</h1>${b||''}</div>`};
function showLogin(msg){
  gate('تسجيل الدخول إلى مجهر',`<p>أدخل كود الدخول الذي أعطاك إياه معلمك، واسمك الثلاثي، ومنطقتك.</p>
  <label class="fld" for="lc">كود الدخول</label><input id="lc" dir="ltr" autocomplete="off" placeholder="XXXX-XXXX" style="text-transform:uppercase">
  <label class="fld" for="ln">الاسم الثلاثي</label><input id="ln" autocomplete="off" placeholder="مثال: محمد أحمد علي">
  <label class="fld" for="lr">المنطقة</label><select id="lr"><option value="">— اختر المنطقة —</option>${CITIES.map(r=>`<option>${r}</option>`).join('')}</select>
  <label class="agree"><input type="checkbox" id="la"><span>أوافق على شروط الاستخدام</span></label>
  <details class="terms"><summary>اقرأ شروط الاستخدام</summary><ul><li>حقوق المحتوى (الدروس والأسئلة والرسوم) محفوظة للمعلم محمد عمارة، ولا يجوز نسخه أو نشره أو تصويره.</li><li>يُمنع مشاركة كود الدخول مع غير صاحبه.</li><li>يُحفظ اسمك ومنطقتك وتاريخ استخدامك للمنصة.</li></ul></details>
  <p id="lm" class="hint" style="margin-top:10px">${esc(msg||'')}</p><div class="row"><button class="btn" id="lb">دخول</button></div>
  <p class="hint" id="nocode" style="text-align:center;margin-top:14px"><a href="https://wa.me/966560786209?text=%D8%A7%D9%84%D8%B3%D9%84%D8%A7%D9%85%20%D8%B9%D9%84%D9%8A%D9%83%D9%85%D8%8C%20%D8%A3%D8%B1%D8%BA%D8%A8%20%D9%81%D9%8A%20%D8%A7%D9%84%D8%AD%D8%B5%D9%88%D9%84%20%D8%B9%D9%84%D9%89%20%D9%83%D9%88%D8%AF%20%D8%AF%D8%AE%D9%88%D9%84%20%D9%84%D9%85%D9%86%D8%B5%D8%A9%20%D9%85%D8%AC%D9%87%D8%B1%20%E2%80%94%20%D8%A3%D8%AD%D9%8A%D8%A7%D8%A1%202" target="_blank" rel="noopener" style="color:inherit;text-decoration:underline;font-weight:700">ليس لديك كود؟ تواصل مع المعلم.</a></p>`);
  const go2=async()=>{
    const code=$('#lc').value.trim(),nm=okName($('#ln').value),city=$('#lr').value,m=$('#lm');
    if(!code){m.textContent='اكتب كود الدخول.';return}
    if(!nm){m.textContent='اكتب اسمك الثلاثي بحروف فقط، بلا أرقام أو رموز (ثلاث كلمات على الأقل).';return}
    if(!city){m.textContent='اختر المنطقة من القائمة.';return}
    if(!$('#la').checked){m.textContent='يجب الموافقة على شروط الاستخدام.';return}
    $('#lb').disabled=true;m.textContent='جاري التحقق…';
    const r=await api('redeem',{code,name:nm,city,dev:devId()});
    if(r.ok){const s={tok:r.tok,name:r.name,key:skey(r.name)};setSess(s);enter(s)}
    else{$('#lb').disabled=false;m.textContent=r.m||'تعذر الدخول.'}
  };
  $('#lb').onclick=go2;['lc','ln'].forEach(i=>$('#'+i).onkeydown=e=>{if(e.key==='Enter')go2()});
}
function loadProgress(){try{const r=localStorage.getItem(PKEY());if(r)Object.assign(S,JSON.parse(r))}catch(e){}}
function mountWM(){
  let w=document.getElementById('wm');if(w)w.remove();
  w=document.createElement('div');w.id='wm';w.setAttribute('aria-hidden','true');
  w.innerHTML=Array.from({length:24},()=>`<span>${esc(S.name)}</span>`).join('');document.body.appendChild(w);
  if(!window.__wmo){window.__wmo=new MutationObserver(()=>{if(SESS&&!document.getElementById('wm'))mountWM()});window.__wmo.observe(document.body,{childList:true})}
}
function logoutLocal(msg){setSess(null);SESS=null;showLogin(msg)}
async function enter(sess){
  SESS=sess;gate('جاري تحميل الدروس…');
  const r=await api('content',{tok:sess.tok});
  if(!r.ok||!r.js){gate('تعذر تحميل الدروس',`<p>${esc(r.m||'حدث خطأ.')}</p><div class="row"><button class="btn" onclick="enter(SESS)">إعادة المحاولة</button><button class="btn ghost" onclick="logoutLocal()">تسجيل دخول جديد</button></div>`);return}
  let js=r.js;try{const o=JSON.parse(js);if(o&&o.script)js=o.script}catch(e){}
  const el=document.createElement('script');el.textContent=js;document.head.appendChild(el);
  if(!Object.keys(LESSONS).length){gate('تعذر تحميل الدروس','<p>المحتوى غير مكتمل. تواصل مع معلمك.</p>');return}
  Object.keys(LESSONS).forEach((k,i)=>HUES[k]=(i*43+205)%360);
  loadProgress();S.name=sess.name;restoreState();mountWM();view='home';render();
}
async function boot(){
  $('#lg').src=LOGO;
  const s=getSess();if(!s)return showLogin();
  gate('جاري التحقق من الجلسة…');
  const r=await api('resume',{tok:s.tok});
  if(r.ok)return enter({...s,name:r.name||s.name,key:skey(r.name||s.name)});
  if(r.net){gate('تعذر الاتصال',`<p>${esc(r.m)}</p><div class="row"><button class="btn" onclick="boot()">إعادة المحاولة</button></div>`);return}
  logoutLocal(r.m||'')
}
/* ===== لوحة الشرف (اختيارية، لا يُرسل شيء قبل الضغط) ===== */
function honorHtml(){
  if(!SESS||!S.lesson)return'';const done=S.honor&&S.honor[S.lesson];
  return `<div class="note" id="hn"><b>لوحة الشرف</b><br><small>إدراج اسمك اختياري، ولا يُرسل شيء قبل أن تضغط الزر. يُرسل اسمك ومجموع نقاطك.</small><div class="row" style="margin-top:8px">${done?'<span>✔ أُدرج اسمك في لوحة الشرف.</span>':'<button class="btn ghost" id="hb" onclick="honorSend()">أرغب في إدراج اسمي</button>'}</div></div>`
}
async function honorSend(){
  const b=$('#hb');if(b){b.disabled=true;b.textContent='جاري الإرسال…'}
  const r=await api('honor',{tok:SESS.tok,pts:S.xp});
  if(r.ok){S.honor=S.honor||{};S.honor[S.lesson]=true;save();$('#hn').outerHTML=honorHtml()}
  else if(!r.net&&/الجلسة|أُلغي|الكود|الصلاحية|إيقاف/.test(r.m||'')){logoutLocal(r.m)}
  else{if(b){b.disabled=false;b.textContent='أرغب في إدراج اسمي'}$('#hn').insertAdjacentHTML('beforeend','<p class="hint">'+esc(r.m||'تعذر الإرسال، حاول لاحقًا.')+'</p>')}
}

boot();
</script>
